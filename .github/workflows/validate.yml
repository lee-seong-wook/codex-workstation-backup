name: Validate backup

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests, secrets, hashes, and restore behavior
        shell: pwsh
        run: ./scripts/Test-Backup.ps1
